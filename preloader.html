<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>preloader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #020C1B;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Figtree', -apple-system, sans-serif;
            overflow: hidden;
        }
        
        .loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .loader img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            animation: pulse 2s ease-in-out infinite;
        }
        
        .loader::after {
            content: '';
            position: absolute;
            width: 160px;
            height: 160px;
            border: 2px solid rgba(201, 168, 76, 0.2);
            border-radius: 50%;
            animation: spin 3s linear infinite;
        }
        
        .loader::before {
            content: '';
            position: absolute;
            width: 200px;
            height: 200px;
            border: 1px solid rgba(201, 168, 76, 0.1);
            border-radius: 50%;
            animation: spin 4s linear infinite reverse;
        }
        
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.05);
                opacity: 0.8;
            }
        }
        
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="loader">
        <img src="images/vector/default.png" alt="">
    </div>
    <script>
        window.addEventListener('load', function(){
            function loader(){
               window.location.href= "index.html"
            }
            setTimeout(loader, 500)
        })
    </script>
</body>
</html>
